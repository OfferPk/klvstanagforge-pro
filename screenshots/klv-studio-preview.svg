<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="100%" stop-color="#0f1824"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#152233"/>
      <stop offset="100%" stop-color="#0d1622"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Studio Frame -->
  <rect x="30" y="30" width="1140" height="640" rx="12" fill="#0b131e" stroke="#213348" stroke-width="2" />

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="52" rx="12" fill="#101a28" />
  <circle cx="60" cy="56" r="7" fill="#ff5f56" />
  <circle cx="85" cy="56" r="7" fill="#ffbd2e" />
  <circle cx="110" cy="56" r="7" fill="#27c93f" />

  <!-- Title -->
  <text x="140" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="bold">
    🎯 KLVSTANAGForge Pro v1.0.0 — MISB ST 0601 &amp; NATO STANAG 4609 KLV Studio
  </text>
  <rect x="990" y="44" width="160" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="1005" y="62" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">10/10 PASS • CERTIFIED</text>

  <!-- Nav Tabs -->
  <rect x="50" y="102" width="1100" height="42" rx="8" fill="#0f1824" stroke="#1f2d47" stroke-width="1" />
  <rect x="54" y="106" width="280" height="34" rx="6" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
  <text x="75" y="128" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">1. Telemetry Encoder &amp; Packet</text>
  
  <text x="370" y="128" fill="#8da2bb" font-family="-apple-system, sans-serif" font-size="13">2. Binary Dissector &amp; Parser</text>
  <text x="670" y="128" fill="#8da2bb" font-family="-apple-system, sans-serif" font-size="13">3. Tactical HUD &amp; Overlay</text>
  <text x="930" y="128" fill="#8da2bb" font-family="-apple-system, sans-serif" font-size="13">4. 10-Point Normative Auditor</text>

  <!-- Left Column: Telemetry Encoder -->
  <rect x="50" y="162" width="530" height="485" rx="10" fill="url(#cardGrad)" stroke="#22334f" stroke-width="1" />
  <text x="75" y="196" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">UAS Platform &amp; Sensor Telemetry</text>

  <text x="75" y="235" fill="#8da2bb" font-family="-apple-system, sans-serif" font-size="12">Mission ID &amp; Platform Tail Number:</text>
  <rect x="75" y="245" width="230" height="35" rx="6" fill="#0a111a" stroke="#213348" stroke-width="1" />
  <text x="90" y="268" fill="#e2e8f0" font-family="monospace" font-size="12">MISSION-VALKYRIE-01</text>
  <rect x="325" y="245" width="230" height="35" rx="6" fill="#0a111a" stroke="#213348" stroke-width="1" />
  <text x="340" y="268" fill="#e2e8f0" font-family="monospace" font-size="12">UAV-TX-901</text>

  <text x="75" y="305" fill="#8da2bb" font-family="-apple-system, sans-serif" font-size="12">WGS84 Coordinates (Latitude &amp; Longitude):</text>
  <rect x="75" y="315" width="230" height="35" rx="6" fill="#0a111a" stroke="#213348" stroke-width="1" />
  <text x="90" y="338" fill="#38ef7d" font-family="monospace" font-size="12">34.052200° N</text>
  <rect x="325" y="315" width="230" height="35" rx="6" fill="#0a111a" stroke="#213348" stroke-width="1" />
  <text x="340" y="338" fill="#38ef7d" font-family="monospace" font-size="12">-118.243700° W</text>

  <text x="75" y="375" fill="#8da2bb" font-family="-apple-system, sans-serif" font-size="12">Sensor Altitude &amp; Platform Heading:</text>
  <rect x="75" y="385" width="230" height="35" rx="6" fill="#0a111a" stroke="#213348" stroke-width="1" />
  <text x="90" y="408" fill="#38bdf8" font-family="monospace" font-size="12">HAE Alt: 1520.0 m</text>
  <rect x="325" y="385" width="230" height="35" rx="6" fill="#0a111a" stroke="#213348" stroke-width="1" />
  <text x="340" y="408" fill="#fbbf24" font-family="monospace" font-size="12">Heading: 142.5°</text>

  <rect x="75" y="445" width="480" height="80" rx="8" fill="#0a111a" stroke="#213348" stroke-width="1" />
  <text x="90" y="470" fill="#8da2bb" font-family="-apple-system, sans-serif" font-size="11">UNIVERSAL 16-BYTE KEY (MISB ST 0601)</text>
  <text x="90" y="498" fill="#06b6d4" font-family="monospace" font-size="11">06 0E 2B 34 02 0B 01 01 0E 01 03 01 01 00 00 00</text>

  <rect x="75" y="550" width="230" height="40" rx="6" fill="url(#headerGrad)" />
  <text x="110" y="575" fill="#03080e" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Synthesize KLV Packet</text>

  <!-- Right Column: Tactical HUD & Hex Dissect -->
  <rect x="600" y="162" width="550" height="485" rx="10" fill="url(#cardGrad)" stroke="#22334f" stroke-width="1" />
  <text x="625" y="196" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold">Full-Motion Video HUD &amp; Byte Stream</text>

  <!-- HUD Monitor -->
  <rect x="625" y="215" width="500" height="150" rx="8" fill="#000000" stroke="#213348" stroke-width="1" />
  <circle cx="875" cy="290" r="25" stroke="#06b6d4" stroke-width="1" fill="none" stroke-dasharray="3,3" />
  <line x1="875" y1="275" x2="875" y2="305" stroke="#06b6d4" stroke-width="1" />
  <line x1="860" y1="290" x2="890" y2="290" stroke="#06b6d4" stroke-width="1" />
  
  <text x="640" y="235" fill="#06b6d4" font-family="monospace" font-size="10">UAV-TX-901 • HDG: 142.5°</text>
  <text x="1000" y="235" fill="#38bdf8" font-family="monospace" font-size="10">ALT: 1520m</text>
  <text x="640" y="350" fill="#38ef7d" font-family="monospace" font-size="10">LAT: 34.052200° N | LON: -118.243700° W</text>
  <text x="980" y="350" fill="#10b981" font-family="monospace" font-size="10">MISB LOCK</text>

  <!-- Hex Code Block -->
  <text x="625" y="390" fill="#8da2bb" font-family="-apple-system, sans-serif" font-size="11">RAW KLV BYTE STREAM (MPEG-TS PES STREAM 0xBD):</text>
  <rect x="625" y="400" width="500" height="130" rx="6" fill="#060b12" stroke="#213348" stroke-width="1" />
  <text x="635" y="422" fill="#06b6d4" font-family="monospace" font-size="10">060e2b34020b01010e01030101000000</text>
  <text x="635" y="440" fill="#cbd5e1" font-family="monospace" font-size="10">5b0208000624bf9d91866003134d495353494f4e2d56414c</text>
  <text x="635" y="458" fill="#cbd5e1" font-family="monospace" font-size="10">4b595249452d3031040a5541562d54582d39303105026540</text>
  <text x="635" y="476" fill="#10b981" font-family="monospace" font-size="10">0d043063fdf70e04ac94f1be0f021f1815040000119401024f12</text>

  <!-- Checksum Banner -->
  <rect x="625" y="555" width="500" height="50" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="645" y="585" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">16-BIT CHECKSUM: 0x4F12 (TAG 1) — RUNNING ACCUMULATOR VALID</text>
</svg>
